<!DOCTYPE html>
<html lang="en">
<head>
<title></title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style type="text/css">*{box-sizing:border-box}body{margin:0;padding:0}p{line-height:inherit}</style>
</head>
<body style="background-color:#293B7D;margin:0;padding:0;-webkit-text-size-adjust:none;text-size-adjust:none">
<table border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#293B7D" width="100%">
<tbody>
<tr>
<td>
<table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#fff;color:#000;width:640px;margin:20px auto;border-radius:4px" width="640">
<tbody>
<tr>
<td style="padding:25px 30px;font-family:Verdana,Geneva,sans-serif;color:#293B7D;font-size:14px;line-height:1.6">

<p style="margin:0 0 20px;font-size:15px;">{{ data.headline | e }}</p>

<table border="0" cellpadding="4" cellspacing="0" role="presentation" style="font-size:14px;color:#293B7D;margin-bottom:20px" width="100%">
<tbody>
{% for label, value in data.rows %}<tr><td style="width:220px;vertical-align:top;"><strong>{{ label | e }}:</strong></td><td style="word-break:break-all;">{{ value | e }}</td></tr>
{% endfor %}</tbody>
</table>
</td>
</tr>
</tbody>
</table>
</td>
</tr>
</tbody>
</table>
</body>
</html>
